<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giano Reader</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="dark">
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <button id="open-btn">Open book</button>
        <button id="settings-btn" title="Settings"><img src="/icons/gear.svg" class="icon" alt="" /></button>
      </div>
      <div id="sidebar-controls">
        <label for="lang-select">Translation language</label>
        <select id="lang-select">
          <option value="it">🇮🇹 Italiano</option>
          <option value="en">🇬🇧 English</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="de">🇩🇪 Deutsch</option>
          <option value="es">🇪🇸 Español</option>
          <option value="pt">🇵🇹 Português</option>
          <option value="ru">🇷🇺 Русский</option>
          <option value="zh">🇨🇳 中文</option>
          <option value="ja">🇯🇵 日本語</option>
          <option value="ar">🇸🇦 العربية</option>
          <option value="fil">🇵🇭 Filipino</option>
          <option value="sq">🇦🇱 Shqip</option>
        </select>
      </div>
      <div id="book-info" class="hidden">
        <img id="cover-img" src="" alt="Cover" />
        <div id="book-meta">
          <p id="book-title"></p>
          <p id="book-author"></p>
        </div>
      </div>
      <nav id="toc-container">
        <p id="toc-placeholder">No book open</p>
        <ul id="toc-list"></ul>
      </nav>

      <!-- Segnalibri in fondo alla sidebar -->
      <div id="bookmarks-bar">
        <button id="bookmarks-open-btn" title="Open bookmarks"><img src="/icons/book-bookmark.svg" class="icon" alt="" /> Bookmarks</button>
        <button id="add-bookmark-btn" title="Add bookmark at current position" disabled><img src="/icons/star.svg" class="icon" alt="" /></button>
      </div>
    </aside>

    <main id="reader-area">
      <!-- Layout sempre affiancato -->
      <div id="viewer-wrapper">
        <div id="original-panel">
          <div id="original-header">
            <span id="original-header-label">Original</span>
            <div id="original-header-actions">
              <button id="hide-translation-btn" class="view-toggle-btn" aria-pressed="false" title="" aria-label="">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="2" y="3" width="20" height="18" rx="2"/>
                  <line x1="10" y1="3" x2="10" y2="21"/>
                  <polyline points="14,9 18,12 14,15"/>
                </svg>
              </button>
              <button id="view-toggle-btn" class="view-toggle-btn" aria-pressed="false" disabled title="" aria-label="">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  <polyline points="14,2 14,8 20,8"/>
                  <rect x="8" y="13" width="8" height="6" rx="1"/>
                  <line x1="8" y1="10" x2="13" y2="10"/>
                </svg>
              </button>
            </div>
          </div>
          <div id="original-viewer" class="text-panel"></div>
          <div id="original-native" class="hidden"></div>
        </div>
        <div id="divider"></div>
        <div id="translation-panel">
          <div id="translation-header">
            <span id="translation-lang-label">Translation</span>
            <span id="translation-status"></span>
            <span id="sync-disabled-notice" class="hidden sync-notice"></span>
          </div>
          <div id="translation-viewer" class="text-panel"></div>
        </div>
        <div id="loading-overlay" class="hidden">
          <div class="spinner"></div>
          <p id="loading-text">Loading...</p>
        </div>
        <!-- Placeholder visibile quando nessun libro è aperto -->
        <div id="no-book-placeholder">
          <img src="/logo.png" alt="Giano Reader" />
        </div>
      </div>

      <!-- Barra navigazione capitoli in fondo -->
      <div id="progress-bar-wrap">
        <button id="prev-btn" disabled>&#8592;</button>
        <div id="progress-track">
          <div id="progress-fill"></div>
          <div id="progress-thumb"></div>
          <div id="progress-ticks"></div>
          <div id="progress-tooltip"></div>
        </div>
        <button id="next-btn" disabled>&#8594;</button>
        <span id="page-info">-</span>
      </div>
    </main>
  </div>

  <div id="epub-hidden-mount" aria-hidden="true"></div>

  <!-- Modal: segnalibri -->
  <div id="bookmarks-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="bm-modal-title">
    <div class="modal-box modal-box--bookmarks">
      <div class="modal-header">
        <h2 id="bm-modal-title"><img src="/icons/book-bookmark.svg" class="icon" alt="" /> Bookmarks</h2>
        <button id="bm-close-btn" class="modal-close" title="Close"><img src="/icons/xmark.svg" class="icon" alt="" /></button>
      </div>
      <ul id="bookmarks-list">
        <li id="bookmarks-placeholder">No bookmarks saved</li>
      </ul>
      <div class="modal-footer">
        <button id="bm-import-btn" title="Import bookmarks from JSON"><img src="/icons/upload.svg" class="icon" alt="" /></button>
        <button id="bm-export-btn" title="Export bookmarks to JSON"><img src="/icons/download.svg" class="icon" alt="" /></button>
        <input type="file" id="bm-import-input" accept=".json" style="display:none" />
      </div>
    </div>
  </div>

  <!-- Modal: file segnalibro non trovato -->
  <div id="bookmark-missing-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="bm-missing-modal-title">
    <div class="modal-box">
      <h2 id="bm-missing-modal-title">File not found</h2>
      <p id="bm-modal-msg">The file <strong id="bm-missing-name"></strong> was not found at the saved location. Please locate the file.</p>
      <div class="modal-actions">
        <button id="bm-relocate-btn">Browse...</button>
        <button id="bm-cancel-btn" class="secondary">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Modal: settings -->
  <div id="settings-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
    <div class="modal-box modal-box--settings">
      <div class="modal-header">
        <h2 id="settings-modal-title"><img src="/icons/gear.svg" class="icon" alt="" /> Settings</h2>
        <button id="settings-close-btn" class="modal-close" title="Close"><img src="/icons/xmark.svg" class="icon" alt="" /></button>
      </div>
      <div class="settings-row">
        <label for="ui-lang-select">Interface language</label>
        <select id="ui-lang-select">
          <option value="en">🇬🇧 English</option>
          <option value="it">🇮🇹 Italiano</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="de">🇩🇪 Deutsch</option>
          <option value="es">🇪🇸 Español</option>
          <option value="pt">🇵🇹 Português</option>
          <option value="ru">🇷🇺 Русский</option>
          <option value="zh">🇨🇳 中文</option>
          <option value="ja">🇯🇵 日本語</option>
          <option value="ar">🇸🇦 العربية</option>
          <option value="fil">🇵🇭 Filipino</option>
          <option value="sq">🇦🇱 Shqip</option>
        </select>
      </div>
      <div class="settings-row">
        <label for="theme-select">Theme</label>
        <select id="theme-select">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="monokai">Monokai</option>
          <option value="solarized-dark">Solarized Dark</option>
          <option value="nord">Nord</option>
          <option value="sepia">Sepia</option>
        </select>
      </div>
      <div class="settings-row">
        <label for="font-family-select">Font</label>
        <select id="font-family-select">
          <option value="Georgia, serif">Georgia</option>
          <option value="'Times New Roman', Times, serif">Times New Roman</option>
          <option value="'Palatino Linotype', Palatino, serif">Palatino</option>
          <option value="'Book Antiqua', Palatino, serif">Book Antiqua</option>
          <option value="Garamond, serif">Garamond</option>
          <option value="Arial, sans-serif">Arial</option>
          <option value="'Segoe UI', Tahoma, sans-serif">Segoe UI</option>
          <option value="Verdana, sans-serif">Verdana</option>
          <option value="'Courier New', Courier, monospace">Courier New</option>
        </select>
      </div>
      <div class="settings-row-inline">
        <label for="font-size-range">Font size</label>
        <input type="range" id="font-size-range" min="12" max="28" step="1" value="16" />
        <span class="settings-value" id="font-size-value">16px</span>
      </div>
      <div id="settings-about">
        <span id="settings-developed-by"></span>
        <span id="settings-version"></span>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
