<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giano Reader</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="dark">
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <button id="open-btn">Open book</button>
        <button id="settings-btn" title="Settings">⚙️</button>
      </div>
      <div id="sidebar-controls">
        <label for="lang-select">Translation language</label>
        <select id="lang-select">
          <option value="it">🇮🇹 Italiano</option>
          <option value="en">🇬🇧 English</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="de">🇩🇪 Deutsch</option>
          <option value="es">🇪🇸 Español</option>
          <option value="pt">🇵🇹 Português</option>
          <option value="ru">🇷🇺 Русский</option>
          <option value="zh">🇨🇳 中文</option>
          <option value="ja">🇯🇵 日本語</option>
          <option value="ar">🇸🇦 العربية</option>
          <option value="fil">🇵🇭 Filipino</option>
          <option value="sq">🇦🇱 Shqip</option>
        </select>
      </div>
      <div id="book-info" class="hidden">
        <img id="cover-img" src="" alt="Cover" />
        <div id="book-meta">
          <p id="book-title"></p>
          <p id="book-author"></p>
        </div>
      </div>
      <nav id="toc-container">
        <p id="toc-placeholder">No book open</p>
        <ul id="toc-list"></ul>
      </nav>

      <!-- Segnalibri in fondo alla sidebar -->
      <div id="bookmarks-bar">
        <button id="bookmarks-open-btn" title="Open bookmarks">🔖 Bookmarks</button>
        <button id="add-bookmark-btn" title="Add bookmark at current position" disabled>★</button>
      </div>
    </aside>

    <main id="reader-area">
      <!-- Layout sempre affiancato -->
      <div id="viewer-wrapper">
        <div id="original-panel">
          <div id="original-header">
            <span id="original-header-label">Original</span>
            <div id="original-header-actions">
              <button id="hide-translation-btn" class="view-toggle-btn" aria-pressed="false" title="" aria-label="">⇔</button>
              <button id="view-toggle-btn" class="view-toggle-btn" aria-pressed="false" disabled title="" aria-label="">📜</button>
            </div>
          </div>
          <div id="original-viewer" class="text-panel"></div>
          <div id="original-native" class="hidden"></div>
        </div>
        <div id="divider"></div>
        <div id="translation-panel">
          <div id="translation-header">
            <span id="translation-lang-label">Translation</span>
            <span id="translation-status"></span>
            <span id="sync-disabled-notice" class="hidden sync-notice"></span>
          </div>
          <div id="translation-viewer" class="text-panel"></div>
        </div>
        <div id="loading-overlay" class="hidden">
          <div class="spinner"></div>
          <p id="loading-text">Loading...</p>
        </div>
        <!-- Placeholder visibile quando nessun libro è aperto -->
        <div id="no-book-placeholder">
          <img src="/logo.png" alt="Giano Reader" />
        </div>
      </div>

      <!-- Barra navigazione capitoli in fondo -->
      <div id="progress-bar-wrap">
        <button id="prev-btn" disabled>&#8592;</button>
        <div id="progress-track">
          <div id="progress-fill"></div>
          <div id="progress-thumb"></div>
          <div id="progress-ticks"></div>
          <div id="progress-tooltip"></div>
        </div>
        <button id="next-btn" disabled>&#8594;</button>
        <span id="page-info">-</span>
      </div>
    </main>
  </div>

  <div id="epub-hidden-mount" aria-hidden="true"></div>

  <!-- Modal: segnalibri -->
  <div id="bookmarks-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="bm-modal-title">
    <div class="modal-box modal-box--bookmarks">
      <div class="modal-header">
        <h2 id="bm-modal-title">🔖 Bookmarks</h2>
        <button id="bm-close-btn" class="modal-close" title="Close">✕</button>
      </div>
      <ul id="bookmarks-list">
        <li id="bookmarks-placeholder">No bookmarks saved</li>
      </ul>
      <div class="modal-footer">
        <button id="bm-import-btn" title="Import bookmarks from JSON">⬆️</button>
        <button id="bm-export-btn" title="Export bookmarks to JSON">⬇️</button>
        <input type="file" id="bm-import-input" accept=".json" style="display:none" />
      </div>
    </div>
  </div>

  <!-- Modal: file segnalibro non trovato -->
  <div id="bookmark-missing-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="bm-missing-modal-title">
    <div class="modal-box">
      <h2 id="bm-missing-modal-title">File not found</h2>
      <p id="bm-modal-msg">The file <strong id="bm-missing-name"></strong> was not found at the saved location. Please locate the file.</p>
      <div class="modal-actions">
        <button id="bm-relocate-btn">Browse...</button>
        <button id="bm-cancel-btn" class="secondary">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Modal: settings -->
  <div id="settings-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
    <div class="modal-box modal-box--settings">
      <div class="modal-header">
        <h2 id="settings-modal-title">⚙️ Settings</h2>
        <button id="settings-close-btn" class="modal-close" title="Close">✕</button>
      </div>
      <div class="settings-row">
        <label for="ui-lang-select">Interface language</label>
        <select id="ui-lang-select">
          <option value="en">🇬🇧 English</option>
          <option value="it">🇮🇹 Italiano</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="de">🇩🇪 Deutsch</option>
          <option value="es">🇪🇸 Español</option>
          <option value="pt">🇵🇹 Português</option>
          <option value="ru">🇷🇺 Русский</option>
          <option value="zh">🇨🇳 中文</option>
          <option value="ja">🇯🇵 日本語</option>
          <option value="ar">🇸🇦 العربية</option>
          <option value="fil">🇵🇭 Filipino</option>
          <option value="sq">🇦🇱 Shqip</option>
        </select>
      </div>
      <div class="settings-row">
        <label for="theme-select">Theme</label>
        <select id="theme-select">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="monokai">Monokai</option>
          <option value="solarized-dark">Solarized Dark</option>
          <option value="nord">Nord</option>
          <option value="sepia">Sepia</option>
        </select>
      </div>
      <div id="settings-about">
        <span id="settings-developed-by"></span>
        <span id="settings-version"></span>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
