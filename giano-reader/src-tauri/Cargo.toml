[package]
name = "giano-reader"
version = "0.9.3"
description = "Giano Reader con traduzione"
authors = ["Giampaolo Bolzonella <giampaolo.bolzonella@gmail.com>"]
edition = "2021"

[package.metadata.bundle]
name = "Giano Reader"
identifier = "com.drloki.giano-reader"
icon = ["icons/32x32.png", "icons/128x128.png", "icons/256x256.png", "icons/icon.ico"]

[lib]
name = "ebook_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
sysinfo = { version = "0.30", default-features = false }

# Web server
axum = { version = "0.8.9", features = ["json", "matched-path", "tower-log", "macros"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "net", "full"] }
rust-embed = { version = "8.11.0", features = ["axum"] }
axum-embed = "0.1.0"
sled = "0.34.7"
epub = "2.1.5"
uuid = { version = "1.23.4", features = ["v4"] }
sha2 = "0.11.0"
tokio-util = { version = "0.7.18", features = ["rt"] }
reqwest = { version = "0.13.4", features = ["json"] }
tower-http = { version = "0.7.0", features = ["cors"] }
chrono = { version = "0.4.45", features = ["serde"] }
local-ip-address = "0.6.3"

[dev-dependencies]
proptest = "1.11.0"
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
