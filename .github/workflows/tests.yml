name: Tests

# Runs on every push to main and on pull requests, and is called by the
# release workflow so a tag is never built from a failing test suite.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: giano-reader/src-tauri -> target

      # The Rust crate links against WebKitGTK (Tauri), also for `cargo test`
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies (web-client)
        run: npm ci
        working-directory: web-client

      - name: Install npm dependencies (giano-reader)
        run: npm ci
        working-directory: giano-reader

      - name: Web client – typecheck
        run: npm run typecheck
        working-directory: web-client

      - name: Web client – tests
        run: npm test
        working-directory: web-client

      # The Rust crate embeds web-client/dist at compile time: build it before cargo
      - name: Web client – build
        run: npm run build
        working-directory: web-client

      - name: Desktop – tests
        run: npm test
        working-directory: giano-reader

      - name: Rust – tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
        working-directory: giano-reader
        env:
          RUST_BACKTRACE: '1'
