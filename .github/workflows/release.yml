name: Release

# Triggered by pushing a version tag (e.g. v0.7.2)
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows → .msi + NSIS .exe
          - platform: windows-latest
            args: ''
          # macOS (Intel + Apple Silicon) → .dmg
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          # Linux → .deb + .AppImage
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    defaults:
      run:
        working-directory: giano-reader

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js ────────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ${{ github.workspace }}/giano-reader/package-lock.json

      # ── Rust ───────────────────────────────────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: giano-reader/src-tauri -> target

      # ── Linux system dependencies ──────────────────────────────────────────
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        # working-directory default does not apply to 'run' steps that use shell
        # these apt commands run in the repo root — that's fine
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── Frontend ───────────────────────────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── Tauri build + upload to release ───────────────────────────────────
      - name: Build Tauri app
        run: npm run tauri build -- ${{ matrix.args }}
        env:
          # Disable debug symbols to keep binary size down
          TAURI_DEBUG: ''

      # ── Collect artifacts ──────────────────────────────────────────────────
      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            giano-reader/src-tauri/target/release/bundle/msi/*.msi
            giano-reader/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: giano-reader/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            giano-reader/src-tauri/target/release/bundle/deb/*.deb
            giano-reader/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  # ── Create GitHub Release with all artifacts ──────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts (debug)
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Giano Reader ${{ github.ref_name }}
          draft: true
          prerelease: false
          body_path: giano-reader/RELEASE_NOTES.md
          files: artifacts/**/*
