name: Release

on:
  push:
    tags:
      - 'v*'

env:
  # Suppress Node.js 20 deprecation warnings on GitHub Actions runners
  ACTIONS_ALLOW_UNSECURE_NODE_VERSION: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: giano-reader/src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies (giano-reader)
        run: npm ci
        working-directory: giano-reader

      - name: Install npm dependencies (web-client)
        run: npm ci
        working-directory: web-client

      - name: Build Tauri app
        run: npm run tauri build -- ${{ matrix.args }}
        working-directory: giano-reader
        env:
          # Print full Rust backtraces on failure
          RUST_BACKTRACE: '1'

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            giano-reader/src-tauri/target/release/bundle/msi/*.msi
            giano-reader/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: giano-reader/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Patch AppImage – add .DirIcon (required by AppDir spec)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -e
          APPIMAGE=$(find giano-reader/src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -n1)
          echo "Patching: $APPIMAGE"

          # Install FUSE (required to run AppImage --appimage-extract on GitHub runners)
          sudo apt-get install -y libfuse2

          # Copy AppImage to a path without spaces to avoid shell quoting issues
          cp "$APPIMAGE" /tmp/input.AppImage
          chmod +x /tmp/input.AppImage

          # Download appimagetool (needed to repack)
          wget -q -O /tmp/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool

          # Extract the AppImage (always extracts to ./squashfs-root relative to cwd)
          cd /tmp
          /tmp/input.AppImage --appimage-extract > /dev/null

          # Show what icons Tauri put inside, so we can build the correct symlink
          echo "=== Icons found in AppDir ==="
          find /tmp/squashfs-root/usr/share/icons -name '*.png' 2>/dev/null || true

          # Find the 256x256 icon inside the AppDir
          INNER_ICON=$(find /tmp/squashfs-root/usr/share/icons/hicolor/256x256/apps -name '*.png' 2>/dev/null | head -n1)

          if [ -n "$INNER_ICON" ]; then
            # Build a relative symlink path from the AppDir root to the icon
            REL_PATH=$(realpath --relative-to=/tmp/squashfs-root "$INNER_ICON")
            echo "Creating symlink: .DirIcon -> $REL_PATH"
            ln -sf "$REL_PATH" /tmp/squashfs-root/.DirIcon
          else
            echo "No 256x256 icon found inside AppDir, copying from source"
            cp giano-reader/src-tauri/icons/256x256.png /tmp/squashfs-root/.DirIcon
          fi

          # Verify
          echo "=== .DirIcon ==="
          ls -la /tmp/squashfs-root/.DirIcon

          cd -

          # Repack back to the original path (overwrite)
          ARCH=x86_64 /tmp/appimagetool /tmp/squashfs-root "$APPIMAGE"

          # Clean up
          rm -rf /tmp/squashfs-root /tmp/input.AppImage

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            giano-reader/src-tauri/target/release/bundle/deb/*.deb
            giano-reader/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Giano Reader ${{ github.ref_name }}
          draft: true
          prerelease: false
          body_path: giano-reader/RELEASE_NOTES.md
          files: artifacts/**/*
