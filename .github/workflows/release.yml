name: Release

on:
  push:
    tags:
      - 'v*'

env:
  # Suppress Node.js 20 deprecation warnings on GitHub Actions runners
  ACTIONS_ALLOW_UNSECURE_NODE_VERSION: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: giano-reader/src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies (giano-reader)
        run: npm ci
        working-directory: giano-reader

      - name: Install npm dependencies (web-client)
        run: npm ci
        working-directory: web-client

      - name: Build Tauri app
        run: npm run tauri build -- ${{ matrix.args }}
        working-directory: giano-reader
        env:
          # Print full Rust backtraces on failure
          RUST_BACKTRACE: '1'

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            giano-reader/src-tauri/target/release/bundle/msi/*.msi
            giano-reader/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: giano-reader/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Patch AppImage – add .DirIcon (required by AppDir spec)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -e
          APPIMAGE=$(find giano-reader/src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -n1)
          echo "Patching: $APPIMAGE"

          # Install tools: squashfs-tools for unsquashfs/mksquashfs (preserves permissions)
          sudo apt-get install -y squashfs-tools

          # Copy AppImage to a path without spaces
          cp "$APPIMAGE" /tmp/input.AppImage
          chmod +x /tmp/input.AppImage

          # Ask the AppImage runtime itself for the squashfs offset (official, reliable).
          # Fragile magic-byte scanning finds spurious matches inside the ELF runtime and
          # even the big-endian magic 'sqsh', which makes unsquashfs fail with
          # "Reading a different endian SQUASHFS filesystem" / "Can't find a valid SQUASHFS superblock".
          OFFSET=$(/tmp/input.AppImage --appimage-offset)
          echo "Squashfs offset: $OFFSET"
          if ! [ "$OFFSET" -gt 0 ] 2>/dev/null; then
            echo "ERROR: could not determine a valid squashfs offset (got '$OFFSET')"
            exit 1
          fi

          # Extract squashfs portion (unsquashfs preserves all permissions)
          unsquashfs -offset "$OFFSET" -dest /tmp/squashfs-root /tmp/input.AppImage

          # Show what icons Tauri put inside
          echo "=== Icons found in AppDir ==="
          find /tmp/squashfs-root/usr/share/icons -name '*.png' 2>/dev/null || true

          # Find the 256x256 icon inside the AppDir and create a relative symlink
          INNER_ICON=$(find /tmp/squashfs-root/usr/share/icons/hicolor/256x256/apps -name '*.png' 2>/dev/null | head -n1)
          if [ -n "$INNER_ICON" ]; then
            REL_PATH=$(realpath --relative-to=/tmp/squashfs-root "$INNER_ICON")
            echo "Creating symlink: .DirIcon -> $REL_PATH"
            ln -sf "$REL_PATH" /tmp/squashfs-root/.DirIcon
          else
            echo "No 256x256 icon found inside AppDir, copying from source"
            cp giano-reader/src-tauri/icons/256x256.png /tmp/squashfs-root/.DirIcon
          fi

          # Ensure the AppRun launcher and the wrapped binary are executable.
          # Firejail (and some sandboxes) exec AppRun.wrapped directly; if it lacks the
          # executable bit the AppImage fails with "AppRun.wrapped: Permission denied"
          # and exits before showing a window. Enforce the bits explicitly instead of
          # trusting whatever unsquashfs/mksquashfs preserved.
          chmod 0755 /tmp/squashfs-root/AppRun
          [ -e /tmp/squashfs-root/AppRun.wrapped ] && chmod 0755 /tmp/squashfs-root/AppRun.wrapped || true
          # The real binary Tauri ships lives under usr/bin; make it executable too.
          find /tmp/squashfs-root/usr/bin -maxdepth 1 -type f -exec chmod 0755 {} + 2>/dev/null || true

          # Verify AppRun and the wrapped launcher are executable before repacking
          echo "=== Launcher permissions ==="
          ls -la /tmp/squashfs-root/AppRun /tmp/squashfs-root/AppRun.wrapped 2>/dev/null || true
          ls -la /tmp/squashfs-root/.DirIcon
          if [ ! -x /tmp/squashfs-root/AppRun ]; then
            echo "ERROR: AppRun is not executable after chmod"
            exit 1
          fi
          if [ -e /tmp/squashfs-root/AppRun.wrapped ] && [ ! -x /tmp/squashfs-root/AppRun.wrapped ]; then
            echo "ERROR: AppRun.wrapped exists but is not executable after chmod"
            exit 1
          fi

          # Repack: extract the ELF runtime header from the original AppImage
          dd if=/tmp/input.AppImage of=/tmp/runtime bs="$OFFSET" count=1 2>/dev/null

          # Build new squashfs with original permissions preserved
          mksquashfs /tmp/squashfs-root /tmp/new.squashfs -root-owned -noappend -comp zstd 2>/dev/null \
            || mksquashfs /tmp/squashfs-root /tmp/new.squashfs -root-owned -noappend

          # Concatenate runtime + new squashfs into the final AppImage
          cat /tmp/runtime /tmp/new.squashfs > "$APPIMAGE"
          chmod +x "$APPIMAGE"

          # Clean up
          rm -rf /tmp/squashfs-root /tmp/input.AppImage /tmp/runtime /tmp/new.squashfs

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            giano-reader/src-tauri/target/release/bundle/deb/*.deb
            giano-reader/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Giano Reader ${{ github.ref_name }}
          draft: true
          prerelease: false
          body_path: giano-reader/RELEASE_NOTES.md
          files: artifacts/**/*
